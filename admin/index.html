<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Lookbook CMS - Supabase</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    .loader {
      border: 3px solid #f3f3f3;
      border-radius: 50%;
      border-top: 3px solid #000;
      width: 20px;
      height: 20px;
      -webkit-animation: spin 1s linear infinite;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    .tab-btn.active { border-bottom: 2px solid black; font-weight: 600; color: black; }
  </style>
</head>
<body class="bg-gray-50 min-h-screen py-10 px-4">

  <!-- Login Overlay -->
  <div id="loginOverlay" class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center hidden">
    <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-sm">
      <h2 class="text-xl font-bold mb-6 text-center">Đăng nhập Admin</h2>
      <form id="loginForm" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
          <input type="email" id="authEmail" required class="w-full px-4 py-2 border rounded-lg focus:ring-black outline-none" placeholder="admin@example.com">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Mật khẩu</label>
          <input type="password" id="authPassword" required class="w-full px-4 py-2 border rounded-lg focus:ring-black outline-none">
        </div>
        <p id="loginError" class="text-red-500 text-sm hidden"></p>
        <button type="submit" class="w-full bg-black text-white py-2 rounded-lg hover:bg-gray-800 transition font-medium">
          Đăng nhập
        </button>
      </form>
    </div>
  </div>

  <div class="max-w-4xl mx-auto bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden" id="appContent" style="display: none;">
    <!-- Header -->
    <div class="bg-black text-white px-8 py-6 flex justify-between items-center">
      <div>
        <h1 class="text-2xl font-semibold tracking-wide">Lookbook Admin</h1>
        <p class="text-gray-400 text-sm mt-1">Quản lý toàn diện cửa hàng của bạn</p>
      </div>
      <button id="logoutBtn" class="text-sm bg-gray-800 hover:bg-gray-700 px-4 py-2 rounded-lg transition">Đăng xuất</button>
    </div>

    <!-- Tabs Navigation -->
    <div class="flex border-b px-8 mt-2 space-x-6">
      <button class="tab-btn active text-gray-500 pb-3 transition" data-target="tab-new-product">Thêm Sản Phẩm Mới</button>
      <button class="tab-btn text-gray-500 pb-3 transition" data-target="tab-manage-products">Quản Lý Sản Phẩm</button>
      <button class="tab-btn text-gray-500 pb-3 transition" data-target="tab-site-info">Cấu Hình Website</button>
    </div>

    <!-- TAB 1: Thêm Sản Phẩm -->
    <div id="tab-new-product" class="tab-content active">
      <form id="productForm" class="p-8 space-y-6">
        <div class="grid grid-cols-2 gap-6">
          <div class="space-y-2">
            <label class="block text-sm font-medium text-gray-700">Tên sản phẩm *</label>
            <input type="text" id="name" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-black outline-none transition" placeholder="VD: Optic White Baby Tee">
          </div>
          
          <div class="space-y-2">
            <label class="block text-sm font-medium text-gray-700">Phân loại *</label>
            <div class="flex gap-2">
              <select id="category" required class="flex-1 px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-black outline-none transition">
                <option value="" disabled selected>Chọn phân loại</option>
              </select>
              <button type="button" id="addCategoryBtn" class="px-4 py-2 bg-gray-100 text-sm font-medium text-gray-700 border border-gray-300 rounded-lg hover:bg-gray-200 transition shrink-0">Thêm mới</button>
            </div>
          </div>
        </div>

        <div class="space-y-2">
          <label class="block text-sm font-medium text-gray-700">Mô tả chi tiết</label>
          <textarea id="description" rows="3" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-black outline-none transition" placeholder="Mô tả sản phẩm..."></textarea>
        </div>

        <hr class="border-gray-100">

        <div class="space-y-4">
          <h3 class="text-lg font-medium text-gray-800">Hình ảnh</h3>
          
          <div class="bg-gray-50 p-6 rounded-xl border border-dashed border-gray-300">
            <label class="block text-sm font-medium text-gray-700 mb-2">Ảnh Chính (Hiển thị đầu tiên) *</label>
            <input type="file" id="mainImage" accept="image/*" required class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-black file:text-white hover:file:bg-gray-800 cursor-pointer">
          </div>

          <div class="bg-gray-50 p-6 rounded-xl border border-dashed border-gray-300">
            <label class="block text-sm font-medium text-gray-700 mb-2">Ảnh Phụ / Gallery (Tùy chọn)</label>
            <input type="file" id="galleryImages" accept="image/*" multiple class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-gray-200 file:text-black hover:file:bg-gray-300 cursor-pointer">
            <p class="text-xs text-gray-400 mt-2">Giữ phím Ctrl (hoặc Cmd) để chọn nhiều ảnh.</p>
          </div>
        </div>

        <div class="pt-4 flex items-center justify-end">
          <div id="statusMessage" class="mr-4 text-sm font-medium"></div>
          <button type="submit" id="submitBtn" class="flex items-center px-6 py-3 bg-black text-white rounded-lg hover:bg-gray-800 transition font-medium shadow-md">
            <span id="btnText">Lưu Sản Phẩm</span>
            <div id="loadingSpinner" class="loader ml-3 hidden"></div>
          </button>
        </div>
      </form>
    </div>

    <!-- TAB 2: Quản Lý Sản Phẩm -->
    <div id="tab-manage-products" class="tab-content p-8">
      <div class="flex justify-between items-center mb-4">
        <h2 class="text-lg font-semibold">Danh sách sản phẩm</h2>
        <button id="refreshProductsBtn" class="px-3 py-1 bg-gray-100 hover:bg-gray-200 rounded text-sm transition">Làm mới</button>
      </div>
      <div class="overflow-x-auto border rounded-xl">
        <table class="w-full text-left text-sm">
          <thead class="bg-gray-50 border-b">
            <tr>
              <th class="px-4 py-3 font-medium text-gray-600">ID</th>
              <th class="px-4 py-3 font-medium text-gray-600">Hình ảnh</th>
              <th class="px-4 py-3 font-medium text-gray-600">Tên</th>
              <th class="px-4 py-3 font-medium text-gray-600">Phân loại</th>
              <th class="px-4 py-3 font-medium text-gray-600 text-center">Hiển thị</th>
            </tr>
          </thead>
          <tbody id="productsTableBody" class="divide-y">
            <!-- Products will be injected here -->
          </tbody>
        </table>
      </div>
      <div id="productsLoading" class="hidden text-center py-4 text-sm text-gray-500">Đang tải...</div>
    </div>

    <!-- TAB 3: Cấu Hình Website -->
    <div id="tab-site-info" class="tab-content p-8">
      <form id="siteInfoForm" class="space-y-6 max-w-2xl">
        <div class="space-y-2">
          <label class="block text-sm font-medium text-gray-700">Tên Website (Title)</label>
          <input type="text" id="siteTitle" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-black outline-none transition">
        </div>
        <div class="space-y-2">
          <label class="block text-sm font-medium text-gray-700">Tên Bộ sưu tập (Collection Title)</label>
          <input type="text" id="collectionTitle" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-black outline-none transition">
        </div>
        <div class="space-y-2">
          <label class="block text-sm font-medium text-gray-700">Mô tả (Collection Description)</label>
          <textarea id="collectionDesc" rows="4" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-black outline-none transition"></textarea>
        </div>
        <div class="pt-4 flex items-center">
          <button type="submit" id="siteInfoBtn" class="flex items-center px-6 py-2 bg-black text-white rounded-lg hover:bg-gray-800 transition font-medium">
            <span id="siteInfoBtnText">Lưu Cấu Hình</span>
            <div id="siteInfoSpinner" class="loader ml-3 hidden border-t-white border-gray-400"></div>
          </button>
          <div id="siteInfoStatus" class="ml-4 text-sm font-medium"></div>
        </div>
      </form>
    </div>

  </div>

  <script type="module" src="../src/admin.js"></script>
</body>
</html>
