<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <title>Minimalist Fashion Lookbook</title>
  
  <!-- Preconnect: giảm thời gian DNS + TLS cho font & image CDN -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://lh3.googleusercontent.com" crossorigin>
  <link rel="dns-prefetch" href="https://script.google.com">

  <!-- Critical Font: Preload chỉ weight thực sự dùng (300,400,500,700) -->
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@300;400;500;700&display=swap">
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@300;400;500;700&display=swap" rel="stylesheet">

  <!-- Material Symbols: chỉ load icon thực sự dùng -->
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=arrow_forward_ios,close,search&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
  <noscript><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=arrow_forward_ios,close,search&display=swap" rel="stylesheet"></noscript>
  
  <!-- Custom Styles -->
  <link rel="stylesheet" href="./src/styles.css">

  <!-- Inline Critical CSS: hiển thị skeleton ngay lập tức, không phải chờ external CSS -->
  <style>
    /* Skeleton hiển thị ngay trước khi stylesheet load xong */
    .skeleton-bar {
      background: linear-gradient(90deg, #ececec 25%, #f5f5f5 50%, #ececec 75%);
      background-size: 200% 100%;
      animation: _shimmer 1.4s infinite;
      border-radius: 4px;
    }
    .skeleton-card {
      background: linear-gradient(90deg, #ececec 25%, #f5f5f5 50%, #ececec 75%);
      background-size: 200% 100%;
      animation: _shimmer 1.4s infinite;
      border-radius: 4px;
      aspect-ratio: 1;
    }
    @keyframes _shimmer {
      from { background-position: 200% 0; }
      to   { background-position: -200% 0; }
    }
    /* Ẩn skeleton khi đã load xong */
    .skeleton-hide { display: none; }
  </style>
</head>
<body class="bg-background text-on-background font-body-md antialiased selection:bg-primary selection:text-on-primary">

  <!-- Header & Navigation -->
  <header class="sticky top-0 z-40 flex flex-col w-full bg-surface/90 backdrop-blur-md px-margin-mobile pt-4 pb-2 border-b border-outline-variant transition-all duration-300">
    <div class="flex items-center justify-between">
      <h1 id="site-title" class="text-headline-md font-headline-md tracking-widest text-primary uppercase flex-1 text-center">22.tatuss</h1>
      <button id="search-toggle-btn" class="text-primary hover:opacity-70 transition-opacity duration-300 p-2 -mr-2" aria-label="Tìm kiếm sản phẩm">
        <span class="material-symbols-outlined">search</span>
      </button>
    </div>
    
    <nav class="flex gap-6 mt-6 overflow-x-auto no-scrollbar pb-2 snap-x-mandatory" id="category-nav">
      <!-- Skeleton tabs — hiển thị ngay khi load -->
      <div class="skeleton-bar" style="width:32px;height:14px;flex-shrink:0"></div>
      <div class="skeleton-bar" style="width:56px;height:14px;flex-shrink:0"></div>
      <div class="skeleton-bar" style="width:48px;height:14px;flex-shrink:0"></div>
      <div class="skeleton-bar" style="width:64px;height:14px;flex-shrink:0"></div>
    </nav>
  </header>

  <!-- ===== SEARCH OVERLAY ===== -->
  <div id="search-overlay" class="search-overlay" aria-hidden="true">
    <div class="search-panel">
      <div class="search-input-wrapper">
        <span class="material-symbols-outlined search-icon-input">search</span>
        <input
          id="search-input"
          type="text"
          placeholder="Tìm sản phẩm..."
          class="search-input"
          autocomplete="off"
          aria-label="Nhập tên sản phẩm cần tìm"
        >
        <button id="search-close-btn" class="search-close-btn" aria-label="Đóng tìm kiếm">
          <span class="material-symbols-outlined">close</span>
        </button>
      </div>
      <div id="search-results" class="search-results" aria-live="polite">
        <!-- Search results injected here -->
      </div>
    </div>
  </div>
  <div id="search-backdrop" class="search-backdrop"></div>
  <!-- ===== END SEARCH OVERLAY ===== -->

  <!-- Main Content -->
  <main class="px-margin-mobile py-stack-md max-w-[1440px] mx-auto md:px-margin-desktop md:py-stack-lg tab-content" id="main-content">
    
    <!-- Hero Section -->
    <section class="mb-4 grid grid-cols-1 gap-gutter">
      <!-- Collection Info -->
      <div>
        <h2 id="collection-title" class="text-display-lg-mobile md:text-display-lg font-display-lg-mobile text-on-surface mb-2">The Core Collection</h2>
        <p id="collection-desc" class="text-body-md font-body-md text-secondary max-w-2xl">A curated selection of foundational pieces designed for effortless layering and timeless silhouette.</p>
      </div>
    </section>

    <!-- Product Grid -->
    <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-x-gutter gap-y-stack-md" id="product-grid">
      <!-- Skeleton product cards — hiện ngay khi page load -->
      <div class="flex flex-col"><div class="skeleton-card"></div><div class="skeleton-bar" style="width:70%;height:14px;margin-top:16px"></div></div>
      <div class="flex flex-col"><div class="skeleton-card"></div><div class="skeleton-bar" style="width:55%;height:14px;margin-top:16px"></div></div>
      <div class="flex flex-col hidden md:flex"><div class="skeleton-card"></div><div class="skeleton-bar" style="width:60%;height:14px;margin-top:16px"></div></div>
      <div class="flex flex-col hidden lg:flex"><div class="skeleton-card"></div><div class="skeleton-bar" style="width:50%;height:14px;margin-top:16px"></div></div>
    </div>

  </main>

  <!-- Full-Screen Zoom Modal -->
  <div class="fixed inset-0 z-50 bg-surface transition-opacity duration-300 flex flex-col" id="zoom-modal" style="display:none; opacity:0; pointer-events:none;">
    <header class="flex justify-between items-center px-margin-mobile py-4 border-b border-outline-variant">
      <h2 class="text-body-lg font-body-lg text-primary" id="zoom-title">Product Detail</h2>
      <button class="text-primary p-2 -mr-2 hover:opacity-70 transition-opacity" onclick="closeZoomModal()">
        <span class="material-symbols-outlined">close</span>
      </button>
    </header>
    <div class="flex-1 overflow-hidden relative">
      <div class="flex w-full h-full overflow-x-auto snap-x-mandatory no-scrollbar overscroll-x-contain" id="zoom-gallery"></div>
      <div class="absolute bottom-6 left-0 right-0 flex justify-center gap-2 pointer-events-none" id="zoom-indicators"></div>
    </div>
  </div>

  <!-- Application Logic -->
  <script type="module" src="./src/main.js"></script>

</body>
</html>
